name: Push Images to GHCR

on:
  release:
    types: [published]
  workflow_dispatch: # Added this so you can run it manually without making a release!
jobs:
  push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Images to My Registry
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          # 1. Handle SearxNG
          docker pull searxng/searxng:latest
          docker tag searxng/searxng:latest ghcr.io/$REPO_OWNER/searxng-mcp:latest
          docker push ghcr.io/$REPO_OWNER/searxng-mcp:latest

          # 2. Handle MCP SearXNG Bridge (Renamed Destination Tag)
          docker pull isokoliuk/mcp-searxng:latest
          docker tag isokoliuk/mcp-searxng:latest ghcr.io/$REPO_OWNER/mcp-searxng:latest
          docker push ghcr.io/$REPO_OWNER/mcp-searxng:latest

          # 3. Handle Python Tester
          docker pull python:3.11
          docker tag python:3.11 ghcr.io/$REPO_OWNER/python-tester:3.11
          docker push ghcr.io/$REPO_OWNER/python-tester:3.11

          # 4. Handle Redis (New)
          docker pull redis:7-alpine
          docker tag redis:7-alpine ghcr.io/$REPO_OWNER/redis:7-alpine
          docker push ghcr.io/$REPO_OWNER/redis:7-alpine

          # 5. Handle Firecrawl Core (New)
          docker pull mcp/firecrawl:latest
          docker tag mcp/firecrawl:latest ghcr.io/$REPO_OWNER/firecrawl-core:latest
          docker push ghcr.io/$REPO_OWNER/firecrawl-core:latest

          # 6. Handle Real OneSearch Core Engine (New Addition)
          docker pull ghcr.io/yokingma/one-search-mcp:latest
          docker tag ghcr.io/yokingma/one-search-mcp:latest ghcr.io/$REPO_OWNER/mcp-image-sync:latest
          docker push ghcr.io/$REPO_OWNER/mcp-image-sync:latest
